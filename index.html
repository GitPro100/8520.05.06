<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product Recommendation Survey</title>
<style>
:root{--ink:#111827;--muted:#6b7280;--line:#d1d5db;--bg:#f5f7fb;--panel:#fff;--blue:#1d4ed8;--green:#07883b;--red:#b91c1c;--shadow:0 12px 32px rgba(15,23,42,.08)}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);font-size:18px;line-height:1.45}
.wrap{max-width:980px;margin:auto;padding:18px 16px 46px}.top{display:flex;justify-content:flex-end;margin-bottom:12px}.progress{width:260px;height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress div{height:100%;background:#111827;width:0;transition:.2s}.progressText{font-size:13px;color:var(--muted);text-align:right;margin-top:5px}
.screen{background:var(--panel);border:1px solid #e5e7eb;border-radius:18px;box-shadow:var(--shadow);padding:26px;margin-bottom:16px;animation:screenFade .28s ease-out both}@keyframes screenFade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@media (prefers-reduced-motion:reduce){.screen{animation:none}}h2{font-size:28px;margin:0 0 14px;line-height:1.2}h3{font-size:20px;margin:0 0 9px}.lead{font-size:20px}.muted{color:var(--muted)}.blue{color:var(--blue)}
.notice{border-left:4px solid var(--blue);background:#eff6ff;padding:12px 14px;border-radius:10px;margin:14px 0}.warn{border-left-color:var(--red);background:#fef2f2;color:#7f1d1d}.manip{border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0;background:#fafafa}.confirm{display:flex;gap:9px;align-items:flex-start;padding:10px;border:1px solid #cbd5e1;border-radius:10px;margin:13px 0;cursor:pointer}.confirm input{width:18px;height:18px;margin-top:3px}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}button{border:0;border-radius:12px;padding:13px 18px;background:#111827;color:#fff;font-weight:700;font-size:16px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
.goalGrid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:center;margin:16px 0}.nutritionCard{width:250px;border:2px solid #111827;border-radius:10px;padding:10px 13px;background:#fff}.nutritionTitle{font-size:19px;font-weight:800;border-bottom:3px solid #111827;padding-bottom:4px;margin-bottom:4px}.nutriRow{display:grid;grid-template-columns:1fr auto;gap:12px;padding:3px 0;border-bottom:1px solid #d1d5db}.nutriRow:last-child{border-bottom:0}.objectiveBox{border:1px solid #cbd5e1;border-radius:12px;padding:14px;background:#f8fafc}.objectiveBox ol{margin:8px 0 0;padding-left:25px}
.recommendWrap{display:grid;grid-template-columns:285px minmax(0,1fr);gap:22px;align-items:stretch}.infoPanel,.actionPanel{border:1px solid #d7dde5;border-radius:14px;padding:16px}.infoPanel{background:#f8fafc}.panelHeading{font-size:19px;font-weight:800;margin-bottom:10px}.actionPreview{position:relative;width:100%;margin:9px 0;padding:14px 44px 14px 16px;text-align:left;background:linear-gradient(180deg,#fff 0%,#f8fafc 100%);color:#111827;border:2px solid #64748b;border-radius:12px;box-shadow:0 3px 0 #cbd5e1,0 7px 14px rgba(15,23,42,.08);font-weight:700}.actionPreview::after{content:"›";position:absolute;right:17px;top:50%;transform:translateY(-52%);font-size:27px;color:#334155}.previewCaption{font-size:14px;color:#475569;margin:0 0 8px}
.matrixWrap{overflow-x:hidden;margin:16px 0 4px;border:1px solid #d1d5db;border-radius:10px;background:#fff}.matrixTable{width:100%;min-width:0;border-collapse:collapse;table-layout:fixed;font-size:14px}.matrixTable th,.matrixTable td{border-bottom:1px solid #d1d5db;border-right:1px solid #e5e7eb;padding:9px 2px;text-align:center;vertical-align:middle}.matrixTable th:last-child,.matrixTable td:last-child{border-right:0}.matrixTable tr:last-child th,.matrixTable tr:last-child td{border-bottom:0}.matrixTable .statement{width:43%;text-align:left;font-weight:400;font-size:16px;line-height:1.35;padding-left:8px;padding-right:8px}.matrixTable .anchors th{font-size:11px;line-height:1.1;vertical-align:bottom}.matrixTable input{width:18px;height:18px}.scaleHead{font-size:12px;line-height:1.05;font-weight:700;overflow-wrap:normal;word-break:normal}.scaleNum{display:block;font-size:13px;margin-bottom:2px}.scaleAnchor{display:block;font-size:10px;line-height:1.0;font-weight:700;white-space:normal}.testBanner{background:#78350f;color:#fff;border-radius:10px;padding:11px 14px;font-weight:800;letter-spacing:.02em;margin-bottom:16px}.testPanel{border:2px solid #92400e;background:#fffbeb;border-radius:14px;padding:16px}.testPanel .choiceList label{border-color:#b45309;background:#fffdf7}.testNote{color:#78350f;font-weight:700}
.choiceList{display:grid;gap:10px;margin-top:14px}.choiceList label{display:flex;gap:10px;align-items:flex-start;border:1px solid #d1d5db;border-radius:12px;padding:13px;background:#fff;cursor:pointer}.choiceList input{margin-top:4px;transform:scale(1.2)}.field{margin:15px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;max-width:520px;padding:11px;border:1px solid #9ca3af;border-radius:9px;font:inherit}.footer{font-size:12px;color:#9ca3af;text-align:center;margin-top:14px}.hidden{display:none!important}
@media(max-width:760px){body{font-size:16px}.screen{padding:18px}.goalGrid,.recommendWrap{grid-template-columns:1fr}.matrixTable{min-width:0}.matrixTable .statement{width:42%;font-size:15px}.matrixTable th,.matrixTable td{padding-left:2px;padding-right:2px}.scaleAnchor{font-size:9.5px}.nutritionCard{width:240px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><div class="progress"><div id="bar"></div></div><div id="ptext" class="progressText">Not started</div></div></div>
  <main id="app"></main>
  <div class="footer"></div>
</div>
<script>
(function(){
"use strict";
const STUDY_LABEL="8520.05.06 Pretest Override Autonomy";
const STUDY_VERSION="8520.05.06";
const BUILD_VERSION="2026_0830_0921";
const TOTAL_STEPS=9;
const $=s=>document.querySelector(s); const app=$("#app");
const qs=new URLSearchParams(location.search);
const isLocalPreview=location.protocol==="file:";
const isTestMode=isLocalPreview||qs.get("test")==="1"||qs.get("test_mode")==="1"||qs.get("mode")==="test";
const suppliedPid=qs.get("PROLIFIC_PID")||qs.get("pid")||"";
const prolificStudyId=qs.get("STUDY_ID")||""; const prolificSessionId=qs.get("SESSION_ID")||"";
function hash(text){let h=2166136261;for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function random01(){try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296}catch(e){return Math.random()}}
let condAutSource="url"; let cond_aut;
if(isTestMode){cond_aut=null;condAutSource="test_menu";}
else if(qs.has("cond_aut") && ["0","1"].includes(qs.get("cond_aut"))){cond_aut=Number(qs.get("cond_aut"));}
else if(suppliedPid){cond_aut=hash(suppliedPid+"|"+STUDY_LABEL)%2;condAutSource="pid_seed";}
else{cond_aut=random01()<.5?0:1;condAutSource="session_random";}
const duplicateKey=suppliedPid?`${STUDY_VERSION}|${suppliedPid}|complete`:null;
if(!isTestMode && duplicateKey && localStorage.getItem(duplicateKey)==="1" && qs.get("reset")!=="1"){
  app.innerHTML='<section class="screen"><h2>Survey already completed</h2><p>This participant ID has already completed this survey on this browser.</p><p class="muted">If you believe this is an error, please contact the researcher.</p></section>';
  throw new Error("Duplicate completed session blocked");
}
const state={studyLabel:STUDY_LABEL,studyVersion:STUDY_VERSION,buildVersion:BUILD_VERSION,startISO:new Date().toISOString(),endISO:null,PROLIFIC_PID:suppliedPid,STUDY_ID:prolificStudyId,SESSION_ID:prolificSessionId,cond_aut,conditionLabel:cond_aut===null?"Test mode: condition not yet selected":(cond_aut?"High autonomy: override available":"Low autonomy: override unavailable"),conditionSource:condAutSource,testMode:isTestMode?1:0,primary:{},secondary:{},checks:{},demographics:{},events:[]};
let screenStart=performance.now(); let step=1; let completionTimer=null; let acknowledged=false;
function event(name,data={}){state.events.push({name,iso:new Date().toISOString(),...data})}
function rt(){return Math.round(performance.now()-screenStart)}
function setProgress(n,label){step=n;$("#bar").style.width=`${Math.round(n/TOTAL_STEPS*100)}%`;$("#ptext").textContent=label}
function mount(html){app.innerHTML=`<section class="screen">${html}<div id="warning" class="notice warn hidden"></div></section>`;screenStart=performance.now();window.scrollTo({top:0,behavior:"instant"})}
function warn(msg){const w=$("#warning");w.textContent=msg;w.classList.remove("hidden");w.scrollIntoView({behavior:"smooth",block:"center"})}
function nextButton(label="NEXT"){return `<div class="btnrow"><button type="button" id="next">${label}</button></div>`}
function selected(name){const x=document.querySelector(`input[name="${name}"]:checked`);return x?x.value:null}
function allMatrix(prefix,count){const out={};for(let i=1;i<=count;i++){const v=selected(`${prefix}_${i}`);if(v===null)return null;out[`${prefix}_${i}`]=Number(v)}return out}
function mean(vals){return vals.reduce((a,b)=>a+b,0)/vals.length}
function matrix(prefix,statements){
 const nums=[1,2,3,4,5,6,7];
 const heads=nums.map(n=>{
   if(n===1)return `<th class="scaleHead"><span class="scaleNum">1</span><span class="scaleAnchor">Strongly<br>Disagree</span></th>`;
   if(n===7)return `<th class="scaleHead"><span class="scaleNum">7</span><span class="scaleAnchor">Strongly<br>Agree</span></th>`;
   return `<th class="scaleHead"><span class="scaleNum">${n}</span></th>`;
 }).join('');
 return `<div class="matrixWrap"><table class="matrixTable"><thead><tr><th class="statement"></th>${heads}</tr></thead><tbody>${statements.map((s,idx)=>`<tr><th class="statement">${s}</th>${nums.map(n=>`<td><input type="radio" name="${prefix}_${idx+1}" value="${n}" aria-label="${n}"></td>`).join('')}</tr>`).join('')}</tbody></table></div>`
}
function renderTestMode(){setProgress(0,"Test Mode");mount(`<div class="testBanner">TEST MODE — FOR TESTERS ONLY</div><div class="testPanel"><h2 style="color:#78350f">Select Experimental Condition</h2><p class="testNote">This screen is not shown to study participants.</p><p>Select the condition you want to preview.</p><div class="choiceList"><label><input type="radio" name="test_condition" value="0"><span><strong>Low autonomy</strong><br>Override / revised recommendation unavailable</span></label><label><input type="radio" name="test_condition" value="1"><span><strong>High autonomy</strong><br>Override / revised recommendation available</span></label></div>${nextButton("START TEST")}</div>`);$("#next").onclick=()=>{const v=selected("test_condition");if(v===null)return warn("Please select an experimental condition.");cond_aut=Number(v);state.cond_aut=cond_aut;state.conditionLabel=cond_aut?"High autonomy: override available":"Low autonomy: override unavailable";state.conditionSource="test_menu";event("test_condition_selected",{cond_aut,conditionLabel:state.conditionLabel});renderInstructions()}}
function renderInstructions(){setProgress(1,"General Instructions");mount(`<h2>General Instructions</h2><ul><li>This task requires your full attention.</li><li>Complete it on a desktop or laptop computer only.</li><li>Complete it in one sitting, without breaks.</li><li>Do not browse the web or use your phone or another device until the task is complete.</li></ul>${nextButton()}`);$("#next").onclick=()=>{event("instructions_next",{rt_ms:rt()});renderTaskInstructions()}}
function renderTaskInstructions(){setProgress(2,"Task Instructions");mount(`<h2>Task Instructions</h2><p>In the following task, you will make a product-choice decision.</p><p>First, you will be shown the objectives that should guide your choice. An AI agent will then provide an initial product recommendation.</p><p>Please review the recommendation and the actions that would be available to you. You will then answer several questions about the recommendation process.</p>${nextButton()}`);$("#next").onclick=()=>{event("task_instructions_next",{rt_ms:rt()});renderObjectives()}}
function renderAbout(){setProgress(4,"How You Can Interact with the AI Agent");const autonomyText=cond_aut?[`<span class="blue"><strong>You can choose</strong></span> whether to ask the AI agent to revise its recommendation.`,`<span class="blue"><strong>You can override the recommendation</strong></span> and ask the AI agent to generate a revised recommendation before making your final choice.`]:[`<span class="blue"><strong>You cannot choose</strong></span> whether to ask the AI agent to revise its recommendation.`,`<span class="blue"><strong>You cannot override</strong></span> the recommendation or ask the AI agent to generate a revised recommendation before making your final choice.`];mount(`<h2>How You Can Interact with the AI Agent</h2><p>${autonomyText[0]}</p><p>${autonomyText[1]}</p><label class="confirm"><input type="checkbox" id="read"><span>I confirm that I have read how I can interact with the AI agent.</span></label>${nextButton()}`);const b=$("#next");b.disabled=true;$("#read").onchange=e=>b.disabled=!e.target.checked;b.onclick=()=>{state.checks.about_description_confirmed=1;event("about_next",{rt_ms:rt()});renderRecommendation()}}
function renderObjectives(){setProgress(3,"Product Task");mount(`<h2>Choosing an Energy Bar</h2><p>Please see below the nutritional objectives that should guide your selection of the energy bar:</p><div class="goalGrid"><div class="nutritionCard"><div class="nutritionTitle">Your choice objectives</div><div class="nutriRow"><span>Total Fat</span><strong>7 g</strong></div><div class="nutriRow"><span>Protein</span><strong>11 g</strong></div><div class="nutriRow"><span>Carbohydrate</span><strong>30 g</strong></div></div><div class="objectiveBox"><strong>Your task</strong><p>Review the AI agent's initial recommendation and the response options that would be available to you.</p><p class="muted">You will answer several questions before making any final product choice.</p></div></div>${nextButton()}`);$("#next").onclick=()=>{event("objectives_next",{rt_ms:rt()});renderAbout()}}
function renderRecommendation(){setProgress(5,"AI Recommendation");const override=cond_aut?`<div class="actionPreview">Override the AI agent's recommendation<br>and ask it to generate a revised recommendation.</div>`:"";mount(`<h2>Please review the AI agent's initial recommendation.</h2><div class="recommendWrap"><section class="infoPanel"><div class="panelHeading">Information</div><div class="nutritionCard" style="width:100%"><div class="nutritionTitle">Your choice objectives</div><div class="nutriRow"><span>Total Fat</span><strong>7 g</strong></div><div class="nutriRow"><span>Protein</span><strong>11 g</strong></div><div class="nutriRow"><span>Carbohydrate</span><strong>30 g</strong></div></div><div style="height:12px"></div><div class="nutritionCard" style="width:100%"><div class="nutritionTitle">AI agent's recommendation</div><div class="nutriRow"><span>Total Fat</span><strong>7 g</strong></div><div class="nutriRow"><span>Protein</span><strong>14 g</strong></div><div class="nutriRow"><span>Carbohydrate</span><strong>26 g</strong></div></div></section><section class="actionPanel"><div class="panelHeading">Actions available to you</div><p class="previewCaption"><strong>Do not make a choice yet.</strong> Please review the actions that would be available before your final product choice.</p><div class="actionPreview">Choose the AI agent's recommended product.</div>${override}<div class="actionPreview">Pass on the AI agent's recommendation<br>and view other product options.</div></section></div>${nextButton("CONTINUE TO QUESTIONS")}`);$("#next").onclick=()=>{state.checks.recommendation_preview_rt_ms=rt();event("recommendation_preview_next",{rt_ms:rt()});renderPrimary()}}
function renderPrimary(){setProgress(6,"Perceived Autonomy");const items=["I felt free to decide whether to override the AI agent's recommendation.","I could choose whether to ask the AI agent to generate a revised recommendation.","It was up to me whether the AI agent updated its initial recommendation.","I could decide whether the AI agent reconsidered its original recommendation."];mount(`<h2>About your experience with the AI agent</h2><p>Thinking about the AI agent's recommendation process, please indicate your level of agreement with the following statements:</p>${matrix("PA",items)}${nextButton()}`);$("#next").onclick=()=>{const a=allMatrix("PA",4);if(!a)return warn("Please answer all four statements before continuing.");Object.assign(state.primary,a);state.primary.primary_autonomy_mean=mean(Object.values(a));state.primary.rt_ms=rt();event("primary_autonomy_complete",{rt_ms:rt(),mean:state.primary.primary_autonomy_mean});renderSecondary()}}
function renderSecondary(){setProgress(7,"Process Autonomy");const items=["I had control over how the AI agent's recommendation process could proceed.","I had the opportunity to intervene in the AI agent's recommendation process.","I had flexibility in how I could respond to the AI agent's initial recommendation.","The recommendation process gave me decision authority over how to proceed."];mount(`<h2>About the recommendation process</h2><p>Please indicate your level of agreement with the following statements:</p>${matrix("SA",items)}${nextButton()}`);$("#next").onclick=()=>{const a=allMatrix("SA",4);if(!a)return warn("Please answer all four statements before continuing.");Object.assign(state.secondary,a);state.secondary.secondary_autonomy_mean=mean(Object.values(a));state.secondary.rt_ms=rt();event("secondary_autonomy_complete",{rt_ms:rt(),mean:state.secondary.secondary_autonomy_mean});renderOverrideCheck()}}
function renderOverrideCheck(){setProgress(8,"Recommendation Process");mount(`<h2>About the Recommendation Process</h2><p><strong>Before making your final product choice, could you ask the AI agent to generate a revised recommendation?</strong></p><div class="choiceList"><label><input type="radio" name="override_check" value="1"><span>Yes.</span></label><label><input type="radio" name="override_check" value="0"><span>No.</span></label></div>${nextButton()}`);$("#next").onclick=()=>{const chk=selected("override_check");if(chk===null)return warn("Please answer the question about the revised recommendation.");state.checks.override_available_response=Number(chk);state.checks.override_available_correct=Number(chk)===cond_aut?1:0;state.checks.override_check_rt_ms=rt();event("override_check_complete",{rt_ms:rt(),response:Number(chk),correct:state.checks.override_available_correct});renderDemographics()}}
function renderDemographics(){setProgress(9,"About You");mount(`<h2>About You</h2><div class="field"><label for="gender">What is your gender?</label><select id="gender"><option value="">Please select</option><option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option></select></div><div class="field"><label for="age">What is your age?</label><input id="age" type="number" min="18" max="100" step="1"></div><div class="field"><label for="education">What is your highest level of education?</label><select id="education"><option value="">Please select</option><option>Left before completing lower-secondary</option><option>Completed lower-secondary</option><option>Completed upper-secondary</option><option>Studied in higher education</option><option>Completed bachelor's degree</option><option>Completed master's degree or above</option></select></div><div class="field"><label for="income">What is your household annual income?</label><select id="income"><option value="">Please select</option><option>Less than £10,000</option><option>£10,000 - £19,999</option><option>£20,000 - £29,999</option><option>£30,000 - £39,999</option><option>£40,000 - £49,999</option><option>£50,000 - £59,999</option><option>£60,000 - £69,999</option><option>£70,000 - £79,999</option><option>£80,000 - £89,999</option><option>£90,000 - £99,999</option><option>£100,000 - £149,999</option><option>More than £150,000</option></select></div>${nextButton("SUBMIT")}`);$("#next").onclick=()=>{if(!$("#gender").value||!$("#age").value||!$("#education").value||!$("#income").value)return warn("Please complete all questions on this screen.");const age=Number($("#age").value);if(!Number.isInteger(age)||age<18||age>100)return warn("Please enter a valid age from 18 to 100.");state.checks.demographics_rt_ms=rt();state.demographics={gender:$("#gender").value,age,education:$("#education").value,income:$("#income").value};event("demographics_complete",{rt_ms:rt()});renderComplete()}}
function renderComplete(){state.endISO=new Date().toISOString();state.duration_ms=Math.round(performance.now());state.summary={cond_aut:state.cond_aut,conditionLabel:state.conditionLabel,primary_autonomy_mean:state.primary.primary_autonomy_mean,secondary_autonomy_mean:state.secondary.secondary_autonomy_mean,override_available_response:state.checks.override_available_response,override_available_correct:state.checks.override_available_correct};if(duplicateKey)try{localStorage.setItem(duplicateKey,"1")}catch(e){}const payload=JSON.stringify(state);const transferId=state.startISO+"|"+BUILD_VERSION;const message={type:"8520_STUDY_COMPLETE",transferId,studyVersion:STUDY_VERSION,buildVersion:BUILD_VERSION,payload:state,json:payload};function send(){try{window.parent.postMessage(message,"*")}catch(e){}try{if(window.top&&window.top!==window.parent)window.top.postMessage(message,"*")}catch(e){}}function ack(ev){const m=ev.data;if(!m||m.type!=="8520_STUDY_RECEIVED")return;if(m.transferId&&m.transferId!==transferId)return;acknowledged=true;if(completionTimer)clearInterval(completionTimer);window.removeEventListener("message",ack);const s=$("#transferStatus");if(s)s.textContent="Your responses were transferred successfully. Please wait while you are returned to the survey."}window.addEventListener("message",ack);send();let attempts=1;completionTimer=setInterval(()=>{if(acknowledged||attempts>=30){clearInterval(completionTimer);return}attempts++;send()},1000);setProgress(9,"Complete");mount(`<h2>Task complete</h2><p>Your responses have been recorded.</p><p id="transferStatus" class="muted">Please wait while your responses are transferred and you are returned to the survey.</p>`);const returnURL=qs.get("return_url")||qs.get("completion_url");if(returnURL)setTimeout(()=>{location.href=returnURL},1400)}
if(isTestMode)renderTestMode();else renderInstructions();
})();
</script>
</body>
</html>
